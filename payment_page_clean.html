<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Payment</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;font-family:Arial,sans-serif}
.page{max-width:960px;margin:auto;background:#fff;min-height:100vh;padding-bottom:110px}
.hero img{display:block;width:100%;height:auto}
.timer{text-align:center;padding:25px 15px 35px;color:#2d3769}
.timer h2{margin:0 0 10px;font-size:20px}
#clock{font-size:clamp(64px,14vw,120px);font-weight:800;font-variant-numeric:tabular-nums}
.chat-btn{position:fixed;right:24px;bottom:24px;width:68px;height:68px;border:0;border-radius:50%;
background:#ff941f;color:#fff;font-size:30px;cursor:pointer;box-shadow:0 7px 22px #0004;z-index:10}
.chat{display:none;position:fixed;right:24px;bottom:104px;width:min(360px,calc(100vw - 30px));height:500px;
background:#fff;border-radius:16px;box-shadow:0 10px 35px #0004;overflow:hidden;z-index:9;flex-direction:column}
.chat.open{display:flex}
.head{background:#2d3769;color:white;padding:14px 16px;display:flex;justify-content:space-between}
.head b{display:block} .head small{opacity:.8}
.close{background:none;border:0;color:#fff;font-size:25px;cursor:pointer}
.msgs{flex:1;padding:14px;background:#f7f8fb;overflow:auto}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin:0 0 10px;line-height:1.4;font-size:14px}
.bot{background:#fff;border:1px solid #ddd} .user{margin-left:auto;background:#2d3769;color:#fff}
.form{display:flex;gap:8px;padding:10px;border-top:1px solid #ddd}
.form input{flex:1;min-width:0;border:1px solid #ccc;border-radius:20px;padding:10px}
.form button{border:0;border-radius:20px;padding:0 15px;background:#2d3769;color:#fff;font-weight:bold}
</style>
</head>

  <section class="timer">
    <h2>TIME REMAINING</h2>
    <div id="clock">30:00</div>
  </section>
</main>

<button class="chat-btn" id="chatBtn" aria-label="Open chat">💬</button>

<section class="chat" id="chat" aria-label="Automated support chat">
  <header class="head">
    <div><b>Payment Support Bot</b><small>Automated assistant</small></div>
    <button class="close" id="close" aria-label="Close chat">×</button>
  </header>
  <div class="msgs" id="msgs">
    <div class="msg bot">Hello! 👋 How can I help you with your payment?</div>
  </div>
  <form class="form" id="form">
    <input id="input" placeholder="Type a message…" autocomplete="off">
    <button>Send</button>
  </form>
</section>

<script>
let remaining=1800;
const clock=document.getElementById('clock');
function render(){
  clock.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
}
render();
const tick=setInterval(()=>{
  if(remaining<=0){clearInterval(tick);clock.textContent='00:00';return}
  remaining--;render();
},1000);

const chat=document.getElementById('chat');
document.getElementById('chatBtn').onclick=()=>chat.classList.toggle('open');
document.getElementById('close').onclick=()=>chat.classList.remove('open');

const msgs=document.getElementById('msgs');
const input=document.getElementById('input');
function add(text,cls){
  const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
}
document.getElementById('form').onsubmit=(e)=>{
  e.preventDefault();const text=input.value.trim();if(!text)return;
  add(text,'user');input.value='';
  setTimeout(()=>add('Thanks for your message. I can help with general payment questions.','bot'),700);
};
</script>
</body>
